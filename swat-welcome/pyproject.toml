[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swat-welcome"
version = "0.1.0"
description = "SWAT first-run profile selection prototype (dry-run only, installs nothing)"
requires-python = ">=3.11"
dependencies = [
    "textual",
    "swat-cli",
]

[project.scripts]
swat-welcome = "swat_welcome.app:run"

[tool.setuptools.packages.find]
where = ["src"]
