[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swat-cli"
version = "0.1.0"
description = "SWAT system diagnostics and maintenance CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swat = "swat_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
