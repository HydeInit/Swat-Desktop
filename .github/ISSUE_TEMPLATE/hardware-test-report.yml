name: Hardware test report
description: Report a boot/install test on real hardware
labels: ["hardware-test"]
body:
  - type: input
    id: device
    attributes:
      label: Device model
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
    validations:
      required: false
  - type: input
    id: gpu
    attributes:
      label: GPU
    validations:
      required: false
  - type: dropdown
    id: boot-mode
    attributes:
      label: Boot mode
      options: ["UEFI", "Legacy BIOS"]
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: ["Boots + installs clean", "Boots, install fails", "Doesn't boot"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / errors
