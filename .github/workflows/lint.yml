name: lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          additional_files: 'auto/config config/hooks/normal/*.hook.chroot config/hooks/live/*.hook.chroot'

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: reviewdog/action-actionlint@60f9666828d33cc321ea5a5c02042d940f790682 # v1
        with:
          fail_level: error
