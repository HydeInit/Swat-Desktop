name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same branch/PR -
# these builds take 6-10+ minutes, no point running two for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; nothing in this workflow needs to write anything
# (no PR comments, no pushed tags/commits).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside Debian trixie itself, matching the distribution being built,
    # so we get the same live-build version the config was written against.
    # Privileged: live-build needs to mount /proc and /dev/pts into the chroot.
    container:
      image: debian:trixie
      options: --privileged
    # Gate the privileged build behind a required-reviewer environment, but
    # only for pull_request events - a fork PR can't run this without
    # explicit maintainer approval in the Actions tab. Direct pushes to
    # master (only possible with repo write access already) skip the gate
    # entirely: environment: "" applies no protection rules.
    environment: ${{ github.event_name == 'pull_request' && 'iso-build' || '' }}
    steps:
      # Monitors network egress during the job and flags anomalies - defense
      # in depth in case a malicious PR (from a fork) ever slips something
      # into a hook script, which would otherwise run with root/--privileged
      # access during the build. Audit mode: reports, doesn't block, since
      # this build legitimately needs broad network access (package mirrors).
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install live-build toolchain
        run: |
          apt-get update
          apt-get install -y sudo live-build debootstrap squashfs-tools xorriso isolinux qemu-utils dosfstools mtools

      # live-build caches the debootstrap output and downloaded .debs in cache/.
      # Restoring it between runs means a build only re-fetches what actually
      # changed, instead of redownloading the whole package set every time.
      #
      # Deliberately not keying on hashFiles(config/**): live-build writes
      # generated files into config/ during the build (root-owned, inside the
      # privileged container), which breaks re-hashing them in the post-job
      # cache-save step every time, regardless of which glob is used. A
      # per-run key with a shared restore prefix sidesteps hashing entirely -
      # each run always saves a fresh cache, and restores the most recent one.
      - name: Restore live-build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: cache
          key: lb-cache-${{ github.run_id }}
          restore-keys: |
            lb-cache-

      - name: Build ISO
        run: ./scripts/build.sh

      - name: Checksum
        run: |
          cd output
          sha256sum -- *.iso | tee SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swat-iso
          path: |
            output/*.iso
            output/SHA256SUMS
          retention-days: 14
