# Required, not optional: without this file, Calamares does not bind-
# mount /dev, /proc, /sys etc. into the target chroot at all (confirmed
# by inspecting the live mount table during a failed install - only the
# root partition itself was mounted, nothing else). That's why
# grub-install failed with "cannot find a device for /boot/grub (is
# /dev mounted?)" - there was no /dev in the target to look in.
#
# This is Calamares' own upstream default (src/modules/mount/mount.conf,
# CC0), not a custom setup - it should have been present from the start.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
