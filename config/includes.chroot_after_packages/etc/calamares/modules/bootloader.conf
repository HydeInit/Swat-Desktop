# Bootloader configuration. Based on Calamares' own upstream default
# (src/modules/bootloader/bootloader.conf, CC0) - required, not
# optional: without efiBootLoader set, the bootloader module hits an
# UnboundLocalError on BIOS/legacy installs (confirmed via an actual
# failed install - upstream bug in bootloader/main.py's
# prepare_bootloader(), which references efi_boot_loader unconditionally
# a few lines after a code path that can leave it unassigned).
---
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 5"
  - "console-mode keep"

kernelParams: [ "quiet" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Debian's unmodified GRUB EFI packages hard-code "debian" as the
# expected bootloader-id path in grubx64.efi - matters once we test
# EFI installs (issue #7), harmless for BIOS installs now.
efiBootloaderId: "debian"

installEFIFallback: true
