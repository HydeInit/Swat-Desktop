# Unsquash the live filesystem onto the target disk.
#
# Path matches live-boot's standard mount point for the live medium's
# squashfs (this is the commented-out "standard" example in Sparky's
# own reference config - they use a custom live medium format, we use
# vanilla live-boot via live-build, so this is the path that applies
# to us).
---
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
