# Configuration for the user-creation step.
---
defaultGroups:
    - audio
    - bluetooth
    - cdrom
    - dialout
    - dip
    - floppy
    - netdev
    - plugdev
    - scanner
    - sudo
    - video
    - users

# Debian convention is the "sudo" group, not "wheel" - matches what
# the sudo package here is actually configured for.
sudoersGroup: sudo

# Default to off for an installed system - unlike the live session,
# an install should require a login by default. Users can still tick
# the box during install.
autologinGroup: autologin
doAutologin: false

setRootPassword: true
doReusePassword: true

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

userShell: /bin/bash

setHostname: EtcFile
writeHostsFile: true
