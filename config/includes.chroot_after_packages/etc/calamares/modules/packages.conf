# Package operations to run on the target system after unpacking.
# Removes the live-session-only and installer-only packages that
# shouldn't remain on an installed system.
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false

operations:
  - remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - calamares
