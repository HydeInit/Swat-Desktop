# Calamares top-level settings for SWAT.
#
# Adapted from SparkyLinux's public Calamares config
# (github.com/sparkylinux/calamares-sparky) as a starting reference -
# closest match since it's Debian-based + Xfce + Calamares already.
# Simplified from their version: uses Calamares' standard built-in
# "bootloader" module (auto-detects BIOS/UEFI) instead of Sparky's
# custom grubefiinstall script, and skips their Secure Boot modules -
# a boring, standard install path first, revisit Secure Boot support
# separately once basic installs are proven reliable.
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - packages
  - bootloader
  - umount
- show:
  - finished

branding: swat

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
